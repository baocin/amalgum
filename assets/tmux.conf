# Amalgum's private tmux config (tmux -L amalgum). tmux only provides session survival;
# Amalgum draws tabs and splits itself, so tmux stays invisible (SPEC §5.28).
set -g status off
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string '#T'
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0
set -g prefix None
unbind-key C-b
