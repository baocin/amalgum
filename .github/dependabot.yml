version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      egui: { patterns: ["egui*", "eframe", "epaint*", "emath"] }
      minor: { update-types: ["minor", "patch"] }
