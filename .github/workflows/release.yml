# Push a v* tag (humans only; must equal Cargo.toml's version) to publish a release:
# static remote CLIs → apps with those CLIs embedded (SPEC §5.31, §9) → signed universal .dmg
# (notarized when Apple secrets exist) and a Linux preview tarball → GitHub release.
#
# Optional secrets: MACOS_CERTIFICATE_P12 (base64), MACOS_CERTIFICATE_PASSWORD,
# MACOS_SIGN_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD. Without them the app is
# ad-hoc signed and Gatekeeper will warn on first launch.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        # bash -eo pipefail: without it, a failing `sed` here would still show green (head's
        # exit status, not sed's, decides the pipeline's) and produce an empty version string.
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml v$version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  cli:
    needs: check-version
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-musl }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - id: build
        # Assign before echoing: with `bash -e`, a failing command substitution used as an
        # echo argument does not fail the step, so a broken build would show green here.
        run: |
          bin="$(scripts/build cli ${{ matrix.target }})"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - run: scripts/check-linkage "${{ steps.build.outputs.bin }}" cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: ${{ steps.build.outputs.bin }}

  app:
    needs: cli
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: embed-in
      - name: Stage CLIs for embedding (embed/<target>/amalgum)
        run: |
          for d in embed-in/cli-*; do t="${d#embed-in/cli-}"; mkdir -p "embed/$t"; cp "$d/amalgum" "embed/$t/amalgum"; done
          ls -l embed/*/amalgum
      - id: build
        env:
          AMALGUM_EMBED_CLI_DIR: ${{ github.workspace }}/embed
        # Assign before echoing: with `bash -e`, a failing command substitution used as an
        # echo argument does not fail the step, so a broken build would show green here.
        run: |
          bin="$(scripts/build app ${{ matrix.target }})"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - run: scripts/check-linkage "${{ steps.build.outputs.bin }}" app
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: ${{ steps.build.outputs.bin }}

  package-macos:
    needs: [check-version, app]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*-apple-darwin
          path: dist/in
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          kc_pw="$(openssl rand -hex 16)"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pw" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$kc_pw" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pw" build.keychain
          rm "$RUNNER_TEMP/cert.p12"
      - name: Bundle, sign, notarize
        id: pkg
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          chmod +x dist/in/*/amalgum
          dmg="$(scripts/package-macos "${{ needs.check-version.outputs.version }}" dist/in/app-aarch64-apple-darwin/amalgum dist/in/app-x86_64-apple-darwin/amalgum)"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ${{ steps.pkg.outputs.dmg }}

  package-linux:
    needs: [check-version, app]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: app-x86_64-unknown-linux-gnu
          path: dist/in
      - id: pkg
        # bash -eo pipefail: without it, a failing `scripts/package-linux` here would still
        # show green (head's exit status, not its, decides the pipeline's) and blame
        # upload-artifact instead.
        shell: bash
        run: |
          chmod +x dist/in/amalgum
          tarball="$(scripts/package-linux "${{ needs.check-version.outputs.version }}" dist/in/amalgum x86_64 | head -1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: ${{ steps.pkg.outputs.tarball }}

  publish:
    needs: [package-macos, package-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: in
      - name: Collect assets
        run: |
          mkdir out
          cp in/release-macos/*.dmg in/release-linux/*.tar.gz out/
          for d in in/cli-*; do cp "$d/amalgum" "out/amalgum-cli-${d#in/cli-}"; done
          (cd out && sha256sum -- * > SHA256SUMS)
          ls -l out
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Amalgum $GITHUB_REF_NAME" --generate-notes
